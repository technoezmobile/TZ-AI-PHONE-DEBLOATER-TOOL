[package]
name = "tz-ai-debloater-tool"
version = "1.1.0"
description = "TZ AI DEBLOATER TOOL - Intelligent Android Debloater & Package Manager"
authors = ["TZ Team"]
edition = "2021"
default-run = "tz-ai-debloater-tool"

[lib]
name = "tz_ai_debloater_lib"
crate-type = ["rlib"]

[[bin]]
name = "tz-ai-debloater-tool"
path = "src/main.rs"

[[bin]]
name = "tz-debloater"
path = "src/bin/tz_debloater.rs"

[[bin]]
name = "mock_adb"
path = "src/bin/mock_adb.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
dirs = "5"
parking_lot = "0.12"
futures-util = "0.3"
which = "7"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 2
