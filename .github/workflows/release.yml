name: Release Multi-Platform Bundles

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tauri:
    name: Build Desktop & CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            args: --bundles nsis,msi
          - platform: macos-aarch64
            os: macos-15
            target: aarch64-apple-darwin
            args: --bundles dmg
          - platform: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            args: --bundles dmg
          - platform: linux-x64
            os: ubuntu-22.04
            args: --bundles deb,appimage

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2 squashfs-tools build-essential curl wget file

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Standalone CLI (`tz-debloater`)
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --bin tz-debloater ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Package Windows CLI Zip
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path src-tauri/target/release/tz-debloater.exe -DestinationPath tz-debloater-${{ github.ref_name }}-windows-x64.zip

      - name: Package Unix CLI Tarball
        if: runner.os != 'Windows'
        run: |
          CLI_PATH="${{ matrix.target && format('src-tauri/target/{0}/release/tz-debloater', matrix.target) || 'src-tauri/target/release/tz-debloater' }}"
          tar -czvf "tz-debloater-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz" -C "$(dirname "$CLI_PATH")" tz-debloater

      - name: Build Desktop Application (Tauri v2)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'TZ AI DEBLOATER TOOL ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG.md for release details.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Upload CLI Artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            tz-debloater-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

